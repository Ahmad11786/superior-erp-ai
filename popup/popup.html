<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Superior ERP AI</title>
    <link rel="stylesheet" href="popup.css">
</head>

<body>

    <div class="container">

        <h2>Superior ERP AI</h2>

        <div id="status" class="status off">
            Auto Fill: OFF
        </div>

        <button id="enableBtn">
            Enable Auto Fill
        </button>

        <button id="disableBtn">
            Disable Auto Fill
        </button>

        <div class="info">
            <p>
                The assistant works only on
                Superior University ERP.
            </p>

            <p>
                Answers must be configured before
                automatic filling.
            </p>
        </div>

    </div>

    <script src="popup.js"></script>

</body>
</html>
